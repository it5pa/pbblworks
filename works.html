<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBBL — Works</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="works-body">

  <!-- Right-Hand Side Vertical Navigation -->
  <aside class="side-nav">
    <a href="/pbbl" class="side-stack pbbl-stack" title="PBBL">
      <span>P</span>
      <span>B</span>
      <span>B</span>
      <span>L</span>
    </a>

    <a href="./#about" class="side-stack about-stack" title="About">
      <span>A</span>
      <span>B</span>
      <span>O</span>
      <span>U</span>
      <span>T</span>
    </a>
  </aside>

  <!-- Works Content Container -->
  <main class="works-container">
    
    <!-- Hero / Featured Spread -->
    <section class="works-hero">
      <div class="hero-cover">
        <img src="images/image 5.png" alt="Cover" class="gallery-item">
      </div>
      <div class="hero-spread">
        <img src="images/image 6.png" alt="Spread" class="gallery-item">
      </div>
    </section>

    <!-- Caption -->
    <figcaption class="works-caption">
      Artist book <em>Merike Estna. The House of Leaking Sky. Preenactment</em> accompanying the Estonian pavilion at the 61st Venice Biennale. 192 pages, softcover, 23.5 &times; 30 cm, 3 papers + a foldout, 2026
    </figcaption>

    <!-- Thumbnail Strip -->
    <section class="works-thumbnails">
      <div class="thumb-item">
        <img src="images/image 2.png" alt="Spread Detail 1" class="gallery-item" alt="1">
      </div>
      <div class="thumb-item">
        <img src="images/image 3.png" alt="Spread Detail 2" class="gallery-item" alt="2">
      </div>
      <div class="thumb-item">
        <img src="images/image 4.png" alt="Spread Detail 3" class="gallery-item" alt="3">
      </div>
      <div class="thumb-item">
        <img src="images/image 7.png" alt="Spread Detail 4" class="gallery-item" alt="4">
      </div>
    </section>

  </main>

<!-- Fullscreen Slideshow Lightbox -->
<div class="slideshow-overlay" id="slideshowOverlay" aria-hidden="true">
  <!-- Pebble Close Button -->
  <button class="slideshow-close" id="slideshowClose" aria-label="Close slideshow">
    <span class="pebble-close-icon"></span>
  </button>

  <!-- Left Pebble Arrow -->
  <button class="slideshow-nav slideshow-prev" id="slideshowPrev" aria-label="Previous image">
    <span class="pebble-arrow-left"></span>
  </button>

  <!-- Centered Image Container -->
  <div class="slideshow-image-container">
    <img id="slideshowImage" src="" alt="Slideshow view">
  </div>

  <!-- Right Pebble Arrow -->
  <button class="slideshow-nav slideshow-next" id="slideshowNext" aria-label="Next image">
    <span class="pebble-arrow-right"></span>
  </button>
</div>
<script src="script.js"></script>
</body>
</html>
